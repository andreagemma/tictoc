name: Publish to PyPI

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

jobs:
  build:
    name: Build and verify distributions
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Find latest stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout latest release
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$RELEASE_TAG" = "v$version" || {
            echo "Tag $RELEASE_TAG does not match package version $version." >&2
            exit 1
          }

      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip build twine
          python -m pip install -e ".[test]"

      - name: Run unit tests
        run: python -m unittest discover -v

      - name: Build wheel and source distribution
        run: python -m build

      - name: Verify distributions
        run: |
          python -m twine check dist/*
          test -n "$(find dist -maxdepth 1 -name 'ga_tictoc-*-py3-none-any.whl' -print -quit)"

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: pypi-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish ga-tictoc to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ga-tictoc
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: pypi-distributions
          path: dist

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.0
        with:
          packages-dir: dist/
